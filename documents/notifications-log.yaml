progress_log:
  - date: 2026-01-10
    area: Backend (Laravel – Authi Action Controllers)
    feature: Job Lifecycle Core
    status: completed
    details:
      - Implemented job state transitions:
          - created → accepted
          - accepted → ready
          - ready → started
          - started → ended
      - Enforced strict state guards to prevent invalid transitions
      - Added database-level transaction safety using DB::transaction
      - Used row-level locking (lockForUpdate) to prevent race conditions
      - Ensured idempotent operations for repeated API calls

  - date: 2026-01-10
    area: Backend (Laravel – Services)
    feature: Notification Service
    status: completed
    details:
      - Created NotificationService under app/Services
      - Implemented notify() for basic notifications
      - Implemented notifyOnce() with event_key for idempotency
      - Linked notifications to job lifecycle events
      - Added support for context_type and context_id
      - Ensured notifications target users (not domain entities)

  - date: 2026-01-10
    area: Backend (Laravel – JobActionControllerAuthi)
    feature: Notifications Integration
    status: completed
    details:
      - Linked notification creation in createJob()
      - Linked notification creation in acceptJob()
      - Linked notification creation in readyJob()
      - Linked notification creation in startJob()
      - Linked notification creation in endJob()
      - Verified foreign key integrity and role-based user resolution

