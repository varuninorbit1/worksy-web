<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      <h1 class="h4 mb-4 text-center">Create your account</h1>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-3">
          <label class="form-label">Full name</label>
          <input type="text" class="form-control" formControlName="name" placeholder="Jane Doe">
          <div class="form-text text-danger" *ngIf="submitted && f['name'].invalid">
            Name is required (min 2 characters).
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email" placeholder="you@example.com">
          <div class="form-text text-danger" *ngIf="submitted && f['email'].invalid">
            Enter a valid email.
          </div>
        </div>

        <!-- Use formGroupName for nested group -->
        <div formGroupName="passwordGroup">
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" formControlName="password" placeholder="At least 6 characters">
            <div class="form-text text-danger" *ngIf="submitted && passwordCtrl?.invalid">
              Password is required (min 6 characters).
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Confirm password</label>
            <input type="password" class="form-control" formControlName="confirmPassword" placeholder="Retype password">
            <div class="form-text text-danger"
              *ngIf="submitted && (confirmPasswordCtrl?.invalid || passwordGroup.errors?.['passwordsMismatch'])">
              Passwords must match.
            </div>
          </div>
        </div>

        <button class="btn btn-primary w-100" [disabled]="loading()">
          {{ loading() ? 'Creating account…' : 'Sign up' }}
        </button>

        @if (error()) {
        <div class="alert alert-danger mt-3 py-2">{{ error() }}</div>
        }

        <p class="mt-3 text-center">
          Already have an account?
          <a routerLink="/login">Sign in</a>
        </p>
      </form>
    </div>
  </div>
</div>
