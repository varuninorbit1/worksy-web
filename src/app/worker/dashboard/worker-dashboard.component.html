<div class="bg-light py-4">
  <div class="container" style="max-width: 1100px">

    <!-- Heading -->
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h3 class="mb-0">Job Lists</h3>
      <button class="btn btn-outline-primary btn-sm">
        <i class="bi bi-plus-circle me-1"></i>
        New Job
      </button>
    </div>

    <!-- Summary -->
    <div class="row g-3 mb-3">
      <div class="col-12">
        <div class="alert alert-secondary mb-0">
          A quick overview of your recent jobs.
        </div>
      </div>

      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="text-muted small">Total Jobs</div>
            <div class="fs-4 fw-semibold">—</div>
          </div>
        </div>
      </div>
    </div>

    <!-- One Job Card (STATIC TEST) -->
    <div class="row g-3">

      @for (job of filteredJobs; track job.id) {
      <div class="col-12 col-md-6 col-xl-4">

        <div class="card shadow-sm h-100 job-card cursor-pointer" (click)="openJob(job.id)">
          <div class="card-body">

            <div class="d-flex justify-content-between">
              <h5 class="mb-1">{{ job.title }}</h5>

              <span class="badge" [ngClass]="{
              'text-bg-warning': job.status === 'pending',
              'text-bg-success': job.status === 'accepted',
              'text-bg-secondary': job.status === 'completed'
            }">
                {{ job.status | titlecase }}
              </span>
            </div>

            <p class="text-muted small">
              <strong>Category:</strong> {{ job.category }} ·
              <strong>Subcategory:</strong> {{ job.subcategory }}
            </p>

          </div>
        </div>

      </div>
      }
    </div>
  </div>
</div>
