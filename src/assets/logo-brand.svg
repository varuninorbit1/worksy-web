<!-- WorkSy SVG Logos: Save each <svg> block as its own file if you like. Colors match the homepage (#6c5ce7 primary, #00c2a8 accent). -->

<!-- ========================= -->
<!-- 1) Horizontal Logo (logomark + wordmark) -->
<!-- Suggested filename: assets/logo.svg -->
<!-- ViewBox is wide; scales crisply at any size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="WorkSy logo (horizontal)">
  <defs>
    <linearGradient id="wsGradPrimary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#4c46d4"/>
    </linearGradient>
    <linearGradient id="wsGradAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c2a8"/>
      <stop offset="100%" stop-color="#00a28d"/>
    </linearGradient>

    <!-- Reusable mark -->
    <symbol id="worksyMark" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="28" fill="url(#wsGradPrimary)"/>
      <!-- Stylized W -->
      <polyline points="14,22 22,42 32,26 42,42 50,22" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Check accent -->
      <polyline points="26,36 32,42 44,28" fill="none" stroke="#00c2a8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <!-- Mark on the left -->
  <use href="#worksyMark" x="8" y="16" width="64" height="64"/>

  <!-- Wordmark -->
  <g transform="translate(92,58)">
    <text font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" font-size="36" y="0" fill="#101223">
      Work<tspan fill="#6c5ce7">S</tspan><tspan fill="#00c2a8">y</tspan>
    </text>
    <text font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" font-size="14" y="20" fill="#6b7280">Find trusted skilled workers</text>
  </g>
</svg>
